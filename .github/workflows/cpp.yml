name: C++ contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --config Debug --parallel 2
      - run: ctest --test-dir build -C Debug --output-on-failure
      - name: Run restart demo
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe=./build/Debug/queue_demo.exe; else exe=./build/queue_demo; fi
          "$exe" demo.wal
          "$exe" demo.wal
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
